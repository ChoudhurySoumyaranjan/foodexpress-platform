# ==========================================
# Application Configuration
# ==========================================
spring.application.name=Backend-Spring
server.port=5001
# ==========================================
# JWT Security Configuration
# ==========================================
# Generate your own strong secret for local/production use
security.jwt.secret-key=YOUR_JWT_SECRET_KEY
security.jwt.access-token-expiration=350000
security.jwt.refresh-token-expiration=604800000
security.jwt.issuer=Backend-Spring
security.jwt.audience=com.lucky.Backend-Spring
# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.web=DEBUG
logging.level.com.lucky.main=DEBUG
# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# ==========================================
# Task Execution
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
# ==========================================
# SSL Configuration - Optional
# ==========================================
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=YOUR_KEYSTORE_PASSWORD
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat
# ==========================================
# Cloudinary Configuration
# ==========================================
cloudinary.cloud-name=YOUR_CLOUDINARY_CLOUD_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET
cloudinary.folder=ecommerce/photos
# ==========================================
# SMTP / Gmail Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
# ==========================================
# Razorpay Configuration
# ==========================================
razorpay.key.id=${razorpay_key}
razorpay.key.secret=${razorpay_secret}
razorpay.currency=${razorpay_currency}
# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ==========================================
# Application Configuration
# ==========================================
# Add your remaining app.* properties here